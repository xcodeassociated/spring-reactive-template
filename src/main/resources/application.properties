spring.config.import=optional:classpath:config/env.properties
spring.main.allow-bean-definition-overriding=false

server.port=8080

spring.grpc.server.port=9080
spring.grpc.client.channels.external.address=localhost:9082
spring.grpc.server.reflection.enabled=true

spring.application.name=spring-reactive-mongo-template

spring.mongodb.host=${MONGO_HOST}
spring.mongodb.port=${MONGO_PORT}
spring.mongodb.username=${MONGO_USER}
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.database=${MONGO_DB}
spring.mongodb.replica-set-name=${MONGO_RS}
spring.data.mongodb.auto-index-creation=true

spring.kafka.bootstrap-servers=${KAFKA_URL}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_GROUP}
# Fan-out listeners (notifications) must NOT replay history: a fresh consumer
# group starting at `earliest` would re-broadcast every historical user event
# to already-current clients. These are the only consumers and all are fan-out,
# so latest is the correct global default (a missed event is a cache-hint gap,
# bounded by the client's onConnect revalidation — see ADR-0006).
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fasterxml.jackson.databind.JsonNode

com.softeno.kafka.tx=${KAFKA_TOPIC_TX}
com.softeno.kafka.rx=${KAFKA_TOPIC_RX}
com.softeno.kafka.keycloak=${KAFKA_KEYCLOAK}
com.softeno.kafka.keycloak-admin=${KAFKA_KEYCLOAK_ADMIN}
# Per-instance identity for notification fan-out groups (ADR-0008): every
# instance must receive EVERY event to broadcast/revoke on ITS OWN
# connections, so each listener's group id is suffixed with this. On
# Kubernetes HOSTNAME is the pod name automatically; override INSTANCE_ID
# when running several instances on one host. Single-instance/dev keeps the
# same effective behavior (one member per group).
com.softeno.kafka.instance-id=${INSTANCE_ID:${HOSTNAME:standalone}}

#com.softeno.external.url=http://localhost:8080/sample
#com.softeno.external.url=http://localhost:8080/sample-secured
com.softeno.external.url=${EXTERNAL_URL}
com.softeno.external.name=${EXTERNAL_NAME}
com.softeno.external.graphql-url=${EXTERNAL_GRAPH_QL}

# per-request logging in sample/http/internal/ExampleWebFilter (uri + query params); off by default
com.softeno.sample.request-log=false

# WebSocket chat adapter: on by default (matchIfMissing); false removes the
# entire WS feature — handler + /ws mapping, /ws-ticket, redeem filter, port adapter
com.softeno.ws.enabled=true
com.softeno.ws.heartbeat-interval-seconds=10
com.softeno.ws.stale-check-threshold-seconds=30
com.softeno.ws.stale-check=true
com.softeno.ws.sweep-interval-seconds=10
# one-time handshake ticket TTL (seconds); tickets are single-use
# one-time tickets (shared ws + sse handshake auth)
com.softeno.ticket.ttl-seconds=10
com.softeno.ticket.sweep-interval-seconds=10
com.softeno.ticket.allowed-origins=http://localhost:3000,http://localhost:8080

# SSE subscription lifecycle
com.softeno.sse.sweep-interval-seconds=10
# exact-match Origin allowlist for the /ws handshake (comma-separated)
# note: :8080 is the origin of the dev chat page served by this app itself
com.softeno.ws.allowed-origins=http://localhost:3000,http://localhost:8080

resilience4j.circuitbreaker.instances.customer-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.customer-service.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.customer-service.slidingWindowType=TIME_BASED
resilience4j.circuitbreaker.instances.customer-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.customer-service.waitDurationInOpenState=50s
resilience4j.circuitbreaker.instances.customer-service.permittedNumberOfCallsInHalfOpenState=3

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI}
spring.security.oauth2.client.registration.keycloak.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=${OAUTH_GRANT_TYPE}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${OAUTH_AUTHORIZATION_URI}
spring.security.oauth2.client.provider.keycloak.token-uri=${OAUTH_TOKEN_URI}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${OAUTH_USER_INFO_URI}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${OAUTH_JWK_SET_URI}

# metrics, prometheus & actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

### grphql
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allowed-methods=*

# metrics, prometheus & actuator
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.tracing.sampling.probability=1.0

spring.reactor.context-propagation=auto

management.tracing.propagation.consume=w3c
management.tracing.propagation.produce=w3c
management.tracing.propagation.type=w3c

management.tracing.baggage.enabled=true
management.tracing.baggage.correlation.enabled=true

# fix for tracing logs
management.observations.enable.spring.security=false
logging.level.io.micrometer.observation.contextpropagation.ObservationThreadLocalAccessor=ERROR